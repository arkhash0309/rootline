  digest: "sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3"
# keycloak-config-cli: Docker Hub tag 6.6.0-26.8.1 is the newest build for Keycloak 26.8 (no 26.8.2 tag yet).
keycloak-config-cli:
  version: "6.6.0-26.8.1"
  repo: "docker.io/adorsys/keycloak-config-cli"
  digest: "sha256:1fafe0823820981c5d33d0e7682a27a817f4a178ab6933387a5c2fca366f92f2"
argo-cd:                 # helm search repo argo/argo-cd --versions: chart 10.20.0, app v3.6.3
  version: "3.6.3"
  chart: "10.20.0"
  repo: "https://argoproj.github.io/argo-helm"

# --- local cluster ---
k3d: "5.9.0"             # gh release list -R k3d-io/k3d --exclude-pre-releases
# k3s: GKE REGULAR default is 1.36.4-gke.2377000 (GKE release notes, regular channel, 2026-11-10; gcloud
# is not authenticated, so the release-notes page was used); newest stable rancher/k3s for minor 1.36
# is v1.36.6+k3s1 (gh release list -R k3s-io/k3s).
k3s: "v1.36.6+k3s1"
gke: "REGULAR"

