# versions.yaml - single source of truth for every pinned version (GEN-050).
# Resolved on the pin date below to the newest stable release that satisfies the GEN-050 line.
# Schema: scripts/versions_lib.py (CONSTRAINTS). Derived files: scripts/render_versions.py.
# Conventions:
#   - A mapping value has `version` (the value the GEN-050 line constrains), and optionally
#     `chart` (Helm chart version), `app` (application version), `repo` (Helm repo URL or image repo),
#     `digest` (sha256 of the multi-arch image index).
#   - Rows whose GEN-050 line names a chart store the chart version in `version` and `chart`
#     and the application version in `app`; `argo-cd` and `traefik` (lines on the application)
#     store the application version in `version` and the chart version in `chart`.
#   - CLI tools are stored without the leading `v` of their git tag.
#   - Source of each value (command or URL) is listed in the comment above it; full table: wiki/versions.md.
pin_date: "2026-11-27"

# --- runtimes (source: PyPI uv, nodejs.org dist/index.json, endoflife.date python) ---
python: "3.12.16"        # endoflife.date/api/python.json cycle 3.12 latest
node: "24.22.3"          # https://nodejs.org/dist/index.json newest v24.x (LTS Krypton)
uv: "0.13.10"            # https://pypi.org/pypi/uv/json info.version

# --- Python packages (source: https://pypi.org/pypi/<pkg>/json, newest stable release inside the line) ---
fastapi: "0.165.0"
sqlalchemy: "2.0.58"     # 2.0.x line (2.1.9 exists, outside the line)
alembic: "1.20.1"
pydantic: "2.14.4"
psycopg: "3.3.9"
httpx: "0.29.0"
anthropic: "1.17.0"      # 1.x line (2.14.0 exists, outside the line)
langgraph: "1.2.24"
langgraph-checkpoint-postgres: "3.2.1"
# mcp 2.3.0: docs/protocol-versions.md and mcp_types/version.py in the 2.3.0 sdist list protocol
# revision 2026-07-28 (KNOWN_PROTOCOL_VERSIONS), so no `mcp_protocol_revision` fallback key is set.
mcp: "2.3.0"
langfuse: "3.15.0"       # 3.x line (5.2.0 exists, outside the line)
drain3: "0.9.11"
ruptures: "1.1.10"
fastembed: "0.9.1"
pydantic-settings: "2.16.3"
python-ulid: "3.2.1"     # 3.x line (4.2.0 exists, outside the line)
pyjwt: "2.15.1"
cryptography: "50.0.2"
pyyaml: "6.0.4"
ruamel-yaml: "0.19.1"    # latest 0.x (PyPI name ruamel.yaml)
duckdb: "1.5.6"          # 1.x line (2.0.1 exists, outside the line)
pandas: "2.3.3"          # 2.x line (3.1.1 exists, outside the line)
pyarrow: "26.0.1"
numpy: "2.5.5"
scipy: "1.18.1"
kubernetes: "37.0.3"
jinja2: "3.1.6"
uvicorn: "0.54.0"
prometheus-client: "0.26.0"
opentelemetry-sdk: "1.45.2"
python-dotenv: "1.2.4"
zstandard: "0.25.0"
matplotlib: "3.11.2"
testcontainers: "4.15.0"
pathspec: "0.12.1"       # latest 0.x (1.1.1 exists, outside the line)
jsonschema: "4.26.0"

# --- Postgres extension (source: gh api repos/pgvector/pgvector/tags, newest v0.8.x) ---
pgvector: "0.8.7"

# --- Node packages (source: npm view <pkg> versions --json, newest stable inside the line) ---
next: "16.4.6"
react: "19.3.1"
typescript: "5.9.3"      # 5.x line (7.0.2 is latest, outside the line)
tailwindcss: "4.3.5"
playwright: "1.65.1"     # npm view playwright version

# --- identity and GitOps ---
