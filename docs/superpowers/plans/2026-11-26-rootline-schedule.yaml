# Rootline execution schedule (overview §7). Single source of truth for stage order.
# Each wave file's "Execution schedule" table mirrors this file; scripts/swarm_schedule.py validate checks both.
# Glob syntax: gitignore-style, relative to the repository root; ** matches across directories;
# a pattern without "/" is anchored at the repository root (overview §7.2, ADR 0040 item 6).
version: 1
max_parallel_implementers: 3
always_allowed:            # overview §7.4
  - wiki/log.md
  - uv.lock
  - apps/console/package-lock.json
  - deploy/root/files/versions.yaml
  - .github/versions.env
  - infra/terraform/*/versions.auto.tf
  - services/api/openapi.json
  - apps/console/lib/api-types.ts
  - prompts/HASHES.json
  - "**/__init__.py"                 # empty package markers only (check_ownership.py verifies size 0 or docstring-only)
  - "**/pyproject.toml"              # dependency arrays only; union-merge rule (§7.4)
  - apps/console/package.json        # dependency maps only; union-merge rule (§7.4)

weeks:
  - week: 1
    stages:
      - id: W1-S1
        mode: sequential
        after: []
        tasks: [{id: W1-T01, branch: feat/w1-repo-skeleton}]
      - id: W1-S2
        mode: sequential
        after: [W1-S1]
        tasks:
          - {id: W1-T16, branch: feat/w1-swarm-tooling}
          - {id: W1-T08, branch: docs/w1-env-repo}
      - id: W1-P1
        mode: parallel
        after: [W1-S2]
        tasks:
          - id: W1-T02
            branch: feat/w1-versions
            owns: [versions.yaml, scripts/versions_lib.py, scripts/check_versions.py, scripts/render_versions.py, tests/repo/test_versions.py]
            deferred_steps: [8]
            deferred_to: W1-S3
          - id: W1-T03
            combined_with: [W1-T04]
            branch: feat/w1-wiki
            owns: [wiki/**, scripts/wiki_lint.py, tests/repo/test_wiki_lint.py, docs/superpowers/specs/2026-11-25-rootline-design.md]
            excludes: [wiki/runbooks/local-up.md]
      - id: W1-P2
        mode: parallel
        after: [W1-P1]
        tasks:
          - id: W1-T05
            branch: feat/w1-wiki-skill
            owns: [.claude/skills/rootline-wiki/**, tests/repo/test_skill.py]
            pre_steps: [1]
            deferred_steps: [4]
            deferred_to: W1-S3
          - id: W1-T06
            branch: feat/w1-taskfile
            owns: [Taskfile.yml, scripts/doctor.py, scripts/run_if_exists.py, scripts/lint.py, .env.example, tests/repo/test_doctor.py]
          - id: W1-T07
