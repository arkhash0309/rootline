        after: [W1-P2]
        tasks:
          - id: W1-T09
            branch: feat/w1-workload-render
            owns: [deploy/upstream/otel-demo/**, scripts/render_workload.py, scripts/workload_transforms.py, tests/repo/test_workload_render.py, tests/repo/fixtures/**, wiki/components/workload.md, tests/registry/TST-WKL-001--W1-T09.yaml]
            deferred_steps: [6, 7]
