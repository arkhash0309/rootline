{{- if has .Values.global.env (list "local" "ci") }}
# INF-031: self-signed issuer -> local CA certificate -> CA issuer -> wildcard certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rootline-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: rootline-local-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: rootline-local-ca
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rootline-ca
spec:
  ca:
    secretName: rootline-local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rootline-wildcard
  namespace: kube-system
spec:
  secretName: rootline-wildcard-tls
  dnsNames:
    - {{ printf "*.%s" .Values.global.domain | quote }}
    - {{ .Values.global.domain | quote }}
  issuerRef:
    name: rootline-ca
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
