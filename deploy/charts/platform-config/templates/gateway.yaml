apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rootline
  namespace: {{ ternary "traefik" "kube-system" (eq .Values.global.env "gke") }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: rootline-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
