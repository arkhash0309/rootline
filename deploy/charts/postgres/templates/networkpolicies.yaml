# Allow-rules for namespace `rootline-data`, which has a default-deny policy (ARC-010, chart
# `namespaces`, W1-T10). Source namespaces are matched by the label kubernetes.io/metadata.name.
---
# Clients: Rootline services (namespace rootline) and Keycloak (namespace keycloak) on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-clients
  namespace: rootline-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "rootline" "keycloak" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 5432}
---
# CNPG operator (namespace cnpg-system): instance status endpoint 8000 and SQL 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: rootline-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 5432}
---
# Pods of the namespace (instance, initdb Job) talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: rootline-data
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# The CNPG instance manager and the initdb Job call the kube-apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: rootline-data
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
