# Wrapper chart: Prometheus (kube-prometheus-stack), Loki, Tempo and the OpenTelemetry Collector
# (spec §6.4, WKL-020 to WKL-023). The `version` lines below are GENERATED from versions.yaml by
# `uv run python scripts/render_versions.py` (GEN-050); edit versions.yaml, never these lines.
apiVersion: v2
name: observability
description: Rootline telemetry stack in namespace observability (no Grafana, ARC-002)
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: "94.1.0"
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: "6.55.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: opentelemetry-collector
    version: "0.183.2"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
