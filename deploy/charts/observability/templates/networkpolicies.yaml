# Allow-rules for namespace `observability`, which has a default-deny policy (ARC-010, chart
# `namespaces`, W1-T10). Source namespaces are matched by the label kubernetes.io/metadata.name.
# Every policy selects all pods (`podSelector: {}`); a rule limits only the destination ports.
# Policy table: ADR 0046 O4. Only `allow-otlp-ingress`, `allow-operator-webhook-ingress` and
# `allow-egress-kubelet` select a subset of pods; every other policy selects all pods.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# OTLP from every namespace (workload and Rootline services) to the collector pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      component: agent-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
# Query APIs: Prometheus 9090, Loki 3100, Tempo 3200 from `rootline` (mcp-telemetry) and `observability`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-query-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "rootline" "observability" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: 3200}
---
# Alertmanager 9093 from `observability` only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9093}
---
# Prometheus Operator admission webhook: the kube-apiserver (a node address, not a pod) calls port 10250.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-webhook-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 10250}
---
# Egress to pods in every namespace: scraping pod targets, collector to Tempo, Loki and Prometheus,
# Alertmanager to the `api` webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-pods
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
---
# kube-apiserver: 6443 is the k3s endpoint port, 443 the GKE one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
# Prometheus scrapes the kubelet and cAdvisor on the node address (10250); no other pod may.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-kubelet
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 10250}
