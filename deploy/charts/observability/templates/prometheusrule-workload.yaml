{{- /*
PrometheusRule rootline-workload (WKL-031, W1-T13). One rule group. Inputs:
  files/metric-map.yaml        PromQL templates of the WKL-030 keys (placeholders $svc and $wl)
  files/alert-thresholds.yaml  baseline-derived thresholds (generated by scripts/derive_thresholds.py)
  values rootlineAlerts        service lists (see values.yaml)
Per-service rules carry the static label `service: <svc>`. Rules on kube-state-metrics series carry no static
`service` label: their expression ends with label_replace(..., "service", ...), because the series already have
a `service` label (the kube-state-metrics Service) that the rule label would not override per series.
*/ -}}
{{- $map := (.Files.Get "files/metric-map.yaml" | fromYaml).metrics -}}
{{- $thr := .Files.Get "files/alert-thresholds.yaml" | fromYaml -}}
{{- $alerts := .Values.rootlineAlerts -}}
{{- $podRegex := "(.*)-[a-z0-9]+-[a-z0-9]+" -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rootline-workload
  namespace: observability
  labels:
    app.kubernetes.io/part-of: rootline
spec:
  groups:
    - name: rootline-workload
      rules:
        {{- range $svc := $alerts.serverServices }}
        {{- $err := $map.error_ratio.promql | replace "$svc" $svc | replace "$wl" $svc }}
        {{- $rate := $map.request_rate.promql | replace "$svc" $svc | replace "$wl" $svc }}
        - alert: ServiceHighErrorRate
          expr: {{ printf "(%s) > 0.05 and (%s) > 0.1" $err $rate | quote }}
          for: 1m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $svc }}
            severity: critical
          annotations:
            summary: {{ printf "Service %s: error ratio above 5 %% with more than 0.1 requests per second" $svc | quote }}
        {{- end }}
        {{- range $svc := $alerts.serverServices }}
        {{- $p95 := $map.latency_p95.promql | replace "$svc" $svc | replace "$wl" $svc }}
        {{- $limit := required (printf "alert-thresholds.yaml has no ServiceHighLatency for %s" $svc) (get $thr.ServiceHighLatency $svc) }}
        - alert: ServiceHighLatency
          expr: {{ printf "(%s) > %v" $p95 $limit | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $svc }}
            severity: warning
          annotations:
            summary: {{ printf "Service %s: p95 latency above %v s (max of 1.0 s and 3 times the baseline p95)" $svc $limit | quote }}
        {{- end }}
        {{- range $svc := $alerts.workloads }}
        {{- $restarts := $map.restarts.promql | replace "$svc" $svc | replace "$wl" $svc }}
        - alert: PodCrashLooping
          expr: {{ printf "(%s) >= 2" $restarts | quote }}
          for: 0m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $svc }}
            severity: critical
          annotations:
            summary: {{ printf "Workload %s: 2 or more container restarts in 5 minutes" $svc | quote }}
        {{- end }}
        - alert: PodNotReady
          expr: {{ printf `label_replace(sum by (pod)(kube_pod_status_ready{namespace="shop",condition="false"}) > 0, "service", "$1", "pod", "%s")` $podRegex | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            severity: warning
          annotations:
            summary: {{ `Pod {{ $labels.pod }} of service {{ $labels.service }} is not Ready` | quote }}
        - alert: DeploymentReplicasUnavailable
          expr: {{ `label_replace(kube_deployment_status_replicas_unavailable{namespace="shop"} > 0, "service", "$1", "deployment", "(.*)")` | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            severity: critical
          annotations:
            summary: {{ `Deployment {{ $labels.deployment }} has unavailable replicas` | quote }}
        - alert: ContainerWaiting
          expr: {{ printf `label_replace(kube_pod_container_status_waiting_reason{namespace="shop",reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError"} > 0, "service", "$1", "pod", "%s")` $podRegex | quote }}
          for: 1m
          labels:
            rootline: "true"
            namespace: shop
            severity: critical
          annotations:
            summary: {{ `Container {{ $labels.container }} of pod {{ $labels.pod }} is waiting: {{ $labels.reason }}` | quote }}
        - alert: PodUnschedulable
          expr: {{ printf `label_replace(kube_pod_status_unschedulable{namespace="shop"} > 0, "service", "$1", "pod", "%s")` $podRegex | quote }}
          for: 1m
          labels:
            rootline: "true"
            namespace: shop
            severity: critical
          annotations:
            summary: {{ `Pod {{ $labels.pod }} cannot be scheduled` | quote }}
        - alert: ContainerOOMKilled
          expr: {{ printf `label_replace((kube_pod_container_status_last_terminated_reason{namespace="shop",reason="OOMKilled"} == 1) and on(pod) (increase(kube_pod_container_status_restarts_total{namespace="shop"}[5m]) > 0), "service", "$1", "pod", "%s")` $podRegex | quote }}
          for: 0m
          labels:
            rootline: "true"
            namespace: shop
            severity: critical
          annotations:
            summary: {{ `Container {{ $labels.container }} of pod {{ $labels.pod }} was OOMKilled and restarted` | quote }}
        {{- $lagSvc := $alerts.kafkaLagService }}
        {{- $lag := $map.kafka_consumer_lag.promql | replace "$svc" $lagSvc | replace "$wl" $lagSvc }}
        {{- $lagLimit := required (printf "alert-thresholds.yaml has no KafkaConsumerLagHigh for %s" $lagSvc) (get $thr.KafkaConsumerLagHigh $lagSvc) }}
        - alert: KafkaConsumerLagHigh
          expr: {{ printf "(%s) > %v" $lag $lagLimit | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $lagSvc }}
            severity: warning
          annotations:
            summary: {{ printf "Service %s: Kafka consumer lag above %v records (max of 1000 and 10 times the baseline)" $lagSvc $lagLimit | quote }}
        {{- range $svc := $alerts.workloads }}
        {{- $cpu := $map.cpu_usage.promql | replace "$svc" $svc | replace "$wl" $svc }}
        - alert: HighCPU
          expr: {{ printf "(%s) > 1.5" $cpu | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $svc }}
            severity: warning
          annotations:
            summary: {{ printf "Workload %s: CPU usage above 1.5 cores for 2 minutes" $svc | quote }}
        {{- end }}
        {{- range $svc := $alerts.workloads }}
        {{- $mem := $map.memory_working_set.promql | replace "$svc" $svc | replace "$wl" $svc }}
        {{- $memLimit := printf `sum(kube_pod_container_resource_limits{namespace="shop",resource="memory",pod=~"%s-[a-z0-9]+-[a-z0-9]+"})` $svc }}
        - alert: HighMemory
          expr: {{ printf "(%s) / (%s) > 0.9" $mem $memLimit | quote }}
          for: 2m
          labels:
            rootline: "true"
            namespace: shop
            service: {{ $svc }}
            severity: warning
          annotations:
            summary: {{ printf "Workload %s: working set above 90 %% of its memory limit" $svc | quote }}
        {{- end }}
