# Observability stack, `local` profile (the base for every environment). Keys are nested under the
# dependency chart name. Overrides: values-gke.yaml (retention), values-ci.yaml (Loki, Tempo and
# the collector off). Requirement IDs: WKL-020 to WKL-023, ARC-002, ARC-030.
global: {}

kube-prometheus-stack:
  grafana: {enabled: false}               # ARC-002: Grafana is not deployed
  nodeExporter: {enabled: false}
  crds: {enabled: false}                  # installed by the prometheus-crds Application (sync wave -3)
  defaultRules: {create: false}
  kubeControllerManager: {enabled: false} # ADR 0046 O5: unreachable on k3s and GKE
  kubeEtcd: {enabled: false}
  kubeScheduler: {enabled: false}
  kubeProxy: {enabled: false}
  kubeStateMetrics: {enabled: true}
  kube-state-metrics:
    resources: {requests: {memory: 64Mi}, limits: {memory: 192Mi}}
  prometheusOperator:
    resources: {requests: {memory: 96Mi}, limits: {memory: 192Mi}}
  alertmanager:
    alertmanagerSpec:
      alertmanagerConfigMatcherStrategy: {type: None}   # WKL-032: no namespace="observability" matcher is injected
      resources: {requests: {memory: 48Mi}, limits: {memory: 128Mi}}
  prometheus:
    prometheusSpec:
      scrapeInterval: 15s                 # WKL-021
      retention: 2d                       # WKL-023 local
      enableOTLPReceiver: true            # WKL-021: --web.enable-otlp-receiver
      otlp:
        promoteResourceAttributes: [service.name, k8s.namespace.name, k8s.pod.name, k8s.deployment.name]
      enableRemoteWriteReceiver: true     # Tempo metrics-generator remote_write (WKL-022)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      resources: {requests: {memory: 768Mi}, limits: {memory: 1536Mi}}

loki:
  enabled: true
  fullnameOverride: loki                  # Service DNS name loki.observability.svc (WKL-020)
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig: {replication_factor: 1}
    storage: {type: filesystem}
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config: {retention_period: 48h, allow_structured_metadata: true}   # WKL-023 local
    compactor: {retention_enabled: true, delete_request_store: filesystem}
  sidecar:
    rules: {enabled: false}               # ARC-030: the rules sidecar container is outside the memory budget
  singleBinary:
    replicas: 1
    resources: {requests: {memory: 256Mi}, limits: {memory: 512Mi}}
  read: {replicas: 0}
  write: {replicas: 0}
  backend: {replicas: 0}
  gateway: {enabled: false}
  chunksCache: {enabled: false}
  resultsCache: {enabled: false}
  lokiCanary: {enabled: false}
  test: {enabled: false}

tempo:
  enabled: true
  fullnameOverride: tempo                 # Service DNS name tempo.observability.svc (WKL-020)
  tempo:
    retention: 48h                        # WKL-023 local
    reportingEnabled: false
    metricsGenerator:                     # WKL-022
      enabled: true
      remoteWriteUrl: http://prometheus-operated.observability.svc:9090/api/v1/write
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
    resources: {requests: {memory: 384Mi}, limits: {memory: 768Mi}}

opentelemetry-collector:                  # WKL-020
  enabled: true
  fullnameOverride: otel-collector        # Service otel-collector; DaemonSet otel-collector-agent (ADR 0046 O1)
  mode: daemonset
  service: {enabled: true}                # the chart creates no Service in daemonset mode by default
  image: {repository: otel/opentelemetry-collector-contrib}
  command: {name: otelcol-contrib}
  presets:
    kubernetesAttributes: {enabled: true}
    logsCollection: {enabled: false}      # ADR 0046 O3: the preset also mounts /var/lib/docker/containers
  securityContext:                        # ADR 0046 O3: UID 0 reads the root:root 0640 pod log files
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  extraVolumes:
    - name: varlogpods
      hostPath: {path: /var/log/pods, type: Directory}
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  resources: {requests: {memory: 192Mi}, limits: {memory: 384Mi}}
  ports:                                  # PSS baseline checks (warn/audit) and Kyverno forbid hostPort
    otlp: {enabled: true, hostPort: 0}
    otlp-http: {enabled: true, hostPort: 0}
    jaeger-compact: {enabled: false}      # Jaeger and Zipkin receivers are outside WKL-020
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
  config:                                 # component names of chart 0.183.2 (ADR 0046 O2)
    receivers:
      jaeger: null                        # null removes the chart-default components WKL-020 does not use
      zipkin: null
      prometheus: null
      otlp: {protocols: {grpc: {endpoint: "0.0.0.0:4317"}, http: {endpoint: "0.0.0.0:4318"}}}
      file_log:
        include: [/var/log/pods/shop_*/*/*.log, /var/log/pods/rootline_*/*/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        retry_on_failure: {enabled: true}
        operators:
          - {type: container, id: container-parser, max_log_size: 102400}
    processors:
      memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20}
      batch: {}
    exporters:
      debug: null
      otlp_grpc/tempo: {endpoint: "tempo.observability.svc:4317", tls: {insecure: true}}
      otlp_http/prometheus: {endpoint: "http://prometheus-operated.observability.svc:9090/api/v1/otlp", tls: {insecure: true}}
      otlp_http/loki: {endpoint: "http://loki.observability.svc:3100/otlp", tls: {insecure: true}}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_grpc/tempo]}
        metrics: {receivers: [otlp], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_http/prometheus]}
        logs: {receivers: [otlp, file_log], processors: [memory_limiter, k8s_attributes, batch], exporters: [otlp_http/loki]}

# Alert rule inputs of templates/prometheusrule-workload.yaml (WKL-030, WKL-031; W1-T13, ADR 0049 D6).
# serverServices: the kept server-side services (every component of scripts/workload_transforms.py
# KEPT_COMPONENTS except load-generator, frontend-proxy, kafka, valkey-cart, astronomy-db and flagd; WKL-004);
# they get ServiceHighErrorRate and ServiceHighLatency rules. workloads: every kept component (WKL-002); they
# get PodCrashLooping, HighCPU and HighMemory rules. kafkaLagService gets KafkaConsumerLagHigh.
# tests/repo/test_alert_rules.py checks both lists against KEPT_COMPONENTS.
rootlineAlerts:
  serverServices:
    - frontend
    - ad
    - cart
    - checkout
    - currency
    - email
    - payment
    - product-catalog
    - quote
    - recommendation
    - shipping
    - fraud-detection
    - image-provider
  workloads:
    - frontend
    - frontend-proxy
    - load-generator
    - flagd
    - ad
    - cart
    - valkey-cart
    - checkout
    - currency
    - email
    - payment
    - product-catalog
    - astronomy-db
    - quote
    - recommendation
    - shipping
    - kafka
    - fraud-detection
    - image-provider
  kafkaLagService: fraud-detection
